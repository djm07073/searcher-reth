server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push
    tenant_id: searcher

scrape_configs:
  - job_name: searcher-reth
    static_configs:
      - targets:
          - localhost
        labels:
          job: searcher-reth
          __path__: /var/log/searcher-reth/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: msg
            target: target
            event: event
            status: status
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          target:
          event: 
          status:

  - job_name: searcher-tx-relayer  
    static_configs:
      - targets:
          - localhost
        labels:
          job: searcher-tx-relayer
          __path__: /var/log/searcher-tx-relayer/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level 
            message: msg
            event: event
            status: status
            routes: routes
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          event:
          status:
          routes: